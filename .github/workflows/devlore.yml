name: Devlore

# Links this repo to Devlore (see docs/PRODUCT.md "Linking a project
# repo") — generated by Devlore's setup wizard, not hand-written.

on:
  push:
    branches: [main]

jobs:
  draft:
    uses: BubbaF377/devlore-workflows/.github/workflows/draft-log-entry.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
  sync-test-plan:
    uses: BubbaF377/devlore-workflows/.github/workflows/sync-test-plan.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
  sync-user-manual:
    uses: BubbaF377/devlore-workflows/.github/workflows/sync-user-manual.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
  sync-visualizer:
    uses: BubbaF377/devlore-workflows/.github/workflows/sync-visualizer.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
