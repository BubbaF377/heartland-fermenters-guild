name: Devkeep

# Links this repo to Devkeep — generated by Devkeep's "Link a project"
# flow, not hand-written.

on:
  push:
    branches: [main]

jobs:
  draft:
    uses: BubbaF377/devkeep-workflows/.github/workflows/draft-log-entry.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
  sync-test-plan:
    uses: BubbaF377/devkeep-workflows/.github/workflows/sync-test-plan.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
  sync-user-manual:
    uses: BubbaF377/devkeep-workflows/.github/workflows/sync-user-manual.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
  sync-visualizer:
    uses: BubbaF377/devkeep-workflows/.github/workflows/sync-visualizer.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
