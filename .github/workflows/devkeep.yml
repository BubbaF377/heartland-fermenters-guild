name: Devkeep

# Links this repo to Devkeep — generated by Devkeep's "Link a project"
# flow, not hand-written.

on:
  push:
    branches: [main]

jobs:
  draft:
    uses: BubbaF377/devkeep-workflows/.github/workflows/draft-log-entry.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
  crypting-candidates-scan:
    uses: BubbaF377/devkeep-workflows/.github/workflows/crypting-candidates-scan.yml@main
    with:
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
      devcrypt-blind-index-key: ${{ secrets.DEVCRYPT_BLIND_INDEX_KEY }}
