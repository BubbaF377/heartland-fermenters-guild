name: Devlore — initial analysis

# One-time codebase analysis, dispatched by the setup wizard right after
# linking/creating this repo (see docs/PRODUCT.md "Setup wizard —
# decided") — generated by Devlore's setup wizard, not hand-written.

on:
  workflow_dispatch:

jobs:
  analyze:
    uses: BubbaF377/devlore-workflows/.github/workflows/analyze-codebase.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
