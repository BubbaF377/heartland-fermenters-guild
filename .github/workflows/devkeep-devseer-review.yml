name: Devkeep — Devseer review

# Architectural review, run on demand from Devkeep. Generated by
# Devkeep's "Link a project" flow, not hand-written.

on:
  workflow_dispatch:
    inputs:
      review-tag:
        description: The release tag to review
        required: true
      review-tier:
        description: Model tier (fast, balanced, capable, max)
        required: false
        default: capable

jobs:
  review:
    uses: BubbaF377/devkeep-workflows/.github/workflows/devseer-review.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
      review-tag: ${{ inputs.review-tag }}
      review-tier: ${{ inputs.review-tier }}
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
