name: Devkeep — baseline capture (draft)

# Reads this repo's existing code to draft a Requirements backfill and a
# baseline master-docs seed, staged in the vault for review. Generated by
# Devkeep's "Link a project" flow, not hand-written.

on:
  workflow_dispatch:

jobs:
  capture-baseline-draft:
    uses: BubbaF377/devkeep-workflows/.github/workflows/capture-baseline-draft.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
