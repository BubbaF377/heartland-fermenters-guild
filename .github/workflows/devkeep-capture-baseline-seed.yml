name: Devkeep — baseline capture (seed)

# Opens a PR seeding this project's first master docs, plus a first
# Onboarding guide, from the baseline draft staged earlier. Generated by
# Devkeep's "Link a project" flow, not hand-written.

on:
  workflow_dispatch:

jobs:
  capture-baseline-seed:
    uses: BubbaF377/devkeep-workflows/.github/workflows/capture-baseline-seed.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
