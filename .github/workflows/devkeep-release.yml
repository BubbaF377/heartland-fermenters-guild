name: Devkeep — release

# Tag-triggered half of linking this repo to Devkeep (see devkeep.yml) —
# generated by Devkeep's "Link a project" flow, not hand-written.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  consolidate:
    uses: BubbaF377/devkeep-workflows/.github/workflows/consolidate-release.yml@main
    with:
      project-name: heartland-fermenters-guild
      tag: ${{ github.ref_name }}
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
  draft-release-notes:
    uses: BubbaF377/devkeep-workflows/.github/workflows/draft-release-notes.yml@main
    with:
      project-name: heartland-fermenters-guild
      tag: ${{ github.ref_name }}
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
  analyze:
    uses: BubbaF377/devkeep-workflows/.github/workflows/analyze-codebase.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
  sync-onboarding:
    uses: BubbaF377/devkeep-workflows/.github/workflows/sync-onboarding.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
