name: Devkeep — release

# Tag-triggered half of linking this repo to Devkeep (see devkeep.yml) —
# generated by Devkeep's "Link a project" flow, not hand-written.
#
# **The manual trigger exists because re-running a failed run is a trap.**
# A GitHub re-run reuses the refs the original run resolved, including the
# moving `@v1` these jobs call — so it repeats the old code rather than
# picking up a fix. On 2026-10-03 a consolidation was re-run to test a fix
# and silently installed a bundle three versions old, which is the version
# that had failed in the first place. A fresh dispatch resolves `@v1`
# again, which is the only way to re-run one of these *with* a fix.
#
# `job` is here because each of these spends money. Re-running the one
# that failed should not pay for the two that succeeded.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to run against, e.g. v1.2.0"
        required: true
        type: string
      job:
        description: "Which job to run"
        required: true
        default: all
        type: choice
        options: [all, consolidate, release-notes, onboarding]

jobs:
  consolidate:
    if: ${{ inputs.job == 'consolidate' || inputs.job == 'all' || github.event_name == 'push' }}
    uses: BubbaF377/devkeep-workflows/.github/workflows/consolidate-release.yml@v1
    with:
      project-name: heartland-fermenters-guild
      tag: ${{ inputs.tag || github.ref_name }}
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
  draft-release-notes:
    if: ${{ inputs.job == 'release-notes' || inputs.job == 'all' || github.event_name == 'push' }}
    uses: BubbaF377/devkeep-workflows/.github/workflows/draft-release-notes.yml@v1
    with:
      project-name: heartland-fermenters-guild
      tag: ${{ inputs.tag || github.ref_name }}
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
  sync-onboarding:
    if: ${{ inputs.job == 'onboarding' || inputs.job == 'all' || github.event_name == 'push' }}
    uses: BubbaF377/devkeep-workflows/.github/workflows/sync-onboarding.yml@v1
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devkeep-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devkeep-github-token: ${{ secrets.DEVKEEP_GITHUB_TOKEN }}
