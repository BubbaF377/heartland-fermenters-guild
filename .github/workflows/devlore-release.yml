name: Devlore — release

# Tag-triggered half of linking this repo to Devlore (see devlore.yml and
# docs/PRODUCT.md "Linking a project repo") — generated by Devlore's
# setup wizard, not hand-written.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  consolidate:
    uses: BubbaF377/devlore/.github/workflows/consolidate-release.yml@main
    with:
      project-name: heartland-fermenters-guild
      tag: ${{ github.ref_name }}
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
  draft-release-notes:
    uses: BubbaF377/devlore/.github/workflows/draft-release-notes.yml@main
    with:
      project-name: heartland-fermenters-guild
      tag: ${{ github.ref_name }}
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
