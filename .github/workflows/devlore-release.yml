name: Devlore — release

# Tag-triggered half of linking this repo to Devlore (see devlore.yml and
# docs/PRODUCT.md "Linking a project repo") — generated by Devlore's
# setup wizard, not hand-written. Also refreshes current-state.md
# (Requirement #34's own follow-up, 2026-08-17): analyze-codebase.yml's
# "Checkout project" step has no explicit ref, so it inherits whatever
# ref actually triggered this run — a version tag here, same as it
# inherits workflow_dispatch's chosen branch when devlore-analyze.yml
# calls the same reusable workflow for the one-time initial analysis.
# No reusable-workflow change needed, just this new job. sync-onboarding
# (Requirement #48) rides the same tag trigger — always regenerates, no
# drift-check, since a real release is itself a meaningful "the world
# changed" event.

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  consolidate:
    uses: BubbaF377/devlore-workflows/.github/workflows/consolidate-release.yml@main
    with:
      project-name: heartland-fermenters-guild
      tag: ${{ github.ref_name }}
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
  draft-release-notes:
    uses: BubbaF377/devlore-workflows/.github/workflows/draft-release-notes.yml@main
    with:
      project-name: heartland-fermenters-guild
      tag: ${{ github.ref_name }}
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
  analyze:
    uses: BubbaF377/devlore-workflows/.github/workflows/analyze-codebase.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
  sync-onboarding:
    uses: BubbaF377/devlore-workflows/.github/workflows/sync-onboarding.yml@main
    with:
      project-name: heartland-fermenters-guild
      vault-repo: BubbaF377/devlore-vault
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      devlore-github-token: ${{ secrets.DEVLORE_GITHUB_TOKEN }}
